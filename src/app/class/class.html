<div class="container">
  <h1 class="heading">Splan for Web</h1>
  <div class="layout">
    <div class="card">
      <div class="cardHeader">
        <h2>Classes</h2>
        <button class="addButton" (click)="showAddClass = true">+</button>
      </div>
      <div *ngFor="let c of classes">
        <app-class-item [className]="c.class" (submit)="showAddSubject = true; currentClass = c.class" (subject)="loadStudents($event ,c.class)" (click)="currentClass = c.class"></app-class-item>
      </div>
      <p class="errorText" *ngIf="classes.length === 0">no classes</p>
    </div>

    <div class="card">
      <div class="cardHeader">
        <h2>Students {{currentClass}} - {{currentSubject}}</h2>
        <button class="addButton" (click)="showAddStudent = true">+</button>
      </div>
      <p class="errorText" *ngIf="students.length === 0">no subject selected</p>
      <div *ngIf="students.length !== 0">
        <div *ngFor="let s of students">
          <app-student [student]="s.name" [class]="s.class" [subject]="currentSubject" (click)="showChooseAction = true; currentStudent = s.name"/>
        </div>
      </div>
    </div>
  </div>

  <div class="alertOverlay" *ngIf="showAddClass" (click)="showAddClass = false">
    <div class="alertContainer" (click)="$event.stopPropagation()">
      <h1>Add a class</h1>

      <input
        class="input"
        placeholder="class"
        [(ngModel)]="newClass"
      />

      <button
        type="button"
        class="button"
        (click)="addClass(); $event.stopPropagation()"
      >
        add
      </button>
    </div>
  </div>

  <div class="alertOverlay" *ngIf="showAddSubject" (click)="showAddSubject = false">
    <div class="alertContainer" (click)="$event.stopPropagation()">
      <h1>Add a subject</h1>

      <input
        class="input"
        placeholder="subject"
        [(ngModel)]="newSubject"
      />

      <button
        type="button"
        class="button"
        (click)="addSubject(); $event.stopPropagation()"
      >
        add
      </button>
    </div>
  </div>

  <div class="alertOverlay" *ngIf="showAddStudent" (click)="showAddStudent = false">
    <div class="alertContainer" (click)="$event.stopPropagation()">
      <h1>Add a Student</h1>

      <div class="searchLayout">
        <input
          class="searchInput"
          placeholder="search for student..."
          [(ngModel)]="searchStudent"
        />
        <button class="searchButton" (click)="filterStudents()"><mat-icon>search</mat-icon></button>
      </div>

      <p class="errorText" *ngIf="filteredStudents.length > 0"></p>
      <div *ngFor="let s of filteredStudents" class="addStudentItem" (click)="addStudent(s.id)">
        <h1>{{s.name}} {{s.class}}</h1>
      </div>



    </div>
  </div>

  <div class="alertOverlay" *ngIf="showChooseAction" (click)="showChooseAction = false">
    <div class="alertContainer" (click)="$event.stopPropagation()">
      <h1>Choose an action</h1>
      <button class="button" (click)="goToGrades()">Manage Grades</button>
      <button class="button" (click)="goToNotes()">Take Notes</button>
    </div>
  </div>
</div>
